[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "container-updater"
version = "0.8.3"
description = "Approval-driven local Docker and remote Portainer update dashboard"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "docker>=7.2.0",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unraid_updater = ["templates/*.html", "static/*.css"]

[project.scripts]
container-updater = "unraid_updater.main:run"
container-updater-cli = "unraid_updater.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "ruff>=0.16.5",
]
